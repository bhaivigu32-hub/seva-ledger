<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Receipt</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="header"><div class="brand">SevaLedger</div><div class="sub">Create Digital Receipt</div></header><main class="content"><h1>New Receipt</h1><p class="muted">Enter donation details below.</p><div class="card"><form action="receipt-preview.html" method="get"><div class="field"><label>Donor Name</label><input name="name" required placeholder="Full name"></div><div class="field"><label>WhatsApp Number</label><input name="phone" required maxlength="10" inputmode="numeric" placeholder="9876543210"></div><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Payment Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option></select></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" required placeholder="Enter amount"><div class="amounts"><a href="receipt.html?amount=101">₹101</a><a href="receipt.html?amount=501">₹501</a><a href="receipt.html?amount=1001">₹1001</a><a href="receipt.html?amount=5001">₹5001</a></div></div><div class="field"><label>Purpose</label><textarea name="purpose" placeholder="Festival donation"></textarea></div><button class="btn primary" type="submit">Generate Receipt</button></form></div></main><nav class="bottom"><div class="bottomin"><a href="index.html"><b>⌂</b>Home</a><a href="donations.html"><b>▤</b>Donations</a><a href="receipt.html"><b>＋</b>Receipt</a><a href="expenses.html"><b>₹</b>Expenses</a><a href="reports.html"><b>▥</b>Reports</a></div></nav></div></body></html>
